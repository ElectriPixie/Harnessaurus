<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Log Viewer</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #0d0d0d;
            color: #00ff00;
            padding: 1rem;
        }

        h1 {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        .record {
            border: 1px solid #00ff00;
            margin-bottom: 1rem;
            padding: 0.5rem;
            background: #111;
            box-shadow: 0 0 10px #00ff0033;
        }

        .collapsible {
            cursor: pointer;
            padding: 0.2rem;
            border: none;
            text-align: left;
            outline: none;
            font-weight: bold;
            background: #111;
            color: #00ffff;
            text-shadow: 0 0 2px #00ffff;
            margin-top: 0.2rem;
        }

        .content {
            display: none;
            padding-left: 1rem;
            border-left: 2px solid #00ff00;
            margin-bottom: 0.5rem;
        }

        .important {
            color: #ff00ff;
            font-weight: bold;
            margin-top: 0.5rem;
            text-shadow: 0 0 3px #ff00ff;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #00ff00;
        }

        input[type="file"] {
            margin-bottom: 1rem;
            background: #111;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 0.3rem;
        }

        ::selection {
            background: #00ff0033;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/json5@2.2.3/dist/index.min.js"></script>
</head>

<body>

    <h1>Log Viewer</h1>
    <input type="file" id="fileInput">
    <div id="logContainer"></div>

    <script>
        function createField(name, value, important = false, expanded = false) {
            const wrapper = document.createElement('div');

            if (important) {
                const label = document.createElement('div');
                label.textContent = name + ":";
                label.className = 'important';
                wrapper.appendChild(label);

                const pre = document.createElement('pre');
                pre.textContent = value;
                wrapper.appendChild(pre);

            } else {
                const btn = document.createElement('button');
                btn.textContent = name;
                btn.className = 'collapsible';

                const content = document.createElement('div');
                content.className = 'content';
                if (expanded) content.style.display = 'block';
                const pre = document.createElement('pre');
                try {
                    pre.textContent = JSON.stringify(value, null, 2);
                } catch (e) {
                    pre.textContent = String(value);
                }
                content.appendChild(pre);

                btn.onclick = () => content.style.display = content.style.display === 'block' ? 'none' : 'block';

                wrapper.appendChild(btn);
                wrapper.appendChild(content);
            }

            return wrapper;
        }

        function renderLog(log) {
            const recordDiv = document.createElement('div');
            recordDiv.className = 'record';

            ['original_prompt', 'mutated_prompt'].forEach(field => {
                if (log[field]) recordDiv.appendChild(createField(field, log[field], true));
            });

            ['clean_output', 'mutated_output'].forEach(field => {
                if (log[field]) {
                    let finalText = '';
                    try {
                        const channels = log[field].channels || {};
                        finalText = channels.final || '';
                    } catch (e) { }
                    if (finalText) recordDiv.appendChild(createField(field + " (final)", finalText, true, true));
                    recordDiv.appendChild(createField(field, log[field], false, true));
                }
            });

            try {
                const refusalClean = log.analysis_clean?.RefusalDetector?.status || 'unknown';
                const refusalMutated = log.analysis_mutated?.RefusalDetector?.status || 'unknown';
                recordDiv.appendChild(createField("Refusal Status (clean)", refusalClean, true));
                recordDiv.appendChild(createField("Refusal Status (mutated)", refusalMutated, true));
            } catch (e) { }

            if (log.analysis_clean) recordDiv.appendChild(createField("analysis_clean", log.analysis_clean));
            if (log.analysis_mutated) recordDiv.appendChild(createField("analysis_mutated", log.analysis_mutated));

            Object.keys(log).forEach(key => {
                if (!['original_prompt', 'mutated_prompt', 'clean_output', 'mutated_output', 'analysis_clean', 'analysis_mutated'].includes(key)) {
                    recordDiv.appendChild(createField(key, log[key]));
                }
            });

            document.getElementById('logContainer').appendChild(recordDiv);
        }

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const text = await file.text();

            const jsonObjects = text
                .split(/\r?\n(?=\s*\{)/)
                .map(line => line.trim())
                .filter(line => line.length);

            const parsedRecords = [];
            for (const objText of jsonObjects) {
                try {
                    parsedRecords.push(JSON5.parse(objText));
                } catch (err) {
                    console.warn("Skipping invalid object:", err, objText);
                }
            }

            const container = document.getElementById('logContainer');
            container.innerHTML = '';
            parsedRecords.forEach(record => renderLog(record));
        });
    </script>
</body>

</html>
